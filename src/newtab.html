<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f3f2;
        --fg: #2c2e2e;
        --muted: #8b8d8d;
        --accent: #1f7a5c;
        --line: rgba(44, 46, 46, 0.12);
        --glow: transparent;
        --panel: rgba(255, 255, 255, 0.66);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0d0d;
          --fg: #cbcdcd;
          --muted: #6a6e6e;
          --accent: #6fcf9f;
          --line: rgba(203, 205, 205, 0.1);
          --glow: rgba(111, 207, 159, 0.28);
          --panel: rgba(9, 10, 10, 0.66);
        }
      }
      /* The row highlight and border are the focus indicators, so drop
         Chrome's blue ring everywhere. */
      :focus,
      :focus-visible {
        outline: none;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      /* Scales every rem in the page at once. */
      html {
        font-size: 15px;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font: 0.9375rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.01em;
        color: var(--fg);
        background: var(--bg);
      }
      /* Both painted in background-art.js: #haze is a still underlay that
         fills the empty space, #sky is the ink that grows on top of it. */
      #haze,
      #sky {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #haze {
        z-index: -2;
      }
      #sky {
        z-index: -1;
      }
      /* The list sits on its own plate, lifted off the field behind it. */
      main {
        width: min(42rem, 90vw);
        padding: 1.5rem 1.25rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: var(--panel);
        backdrop-filter: blur(14px) saturate(130%);
      }
      #search {
        display: block;
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        color: var(--fg);
        caret-color: var(--accent);
        background: none;
        border: 0;
        /* Line up with link titles: numeral (2.5rem) + tree gutter (0.5rem)
           + label padding (0.75rem) + the row's 2px left border. */
        padding: 0.625rem 0.75rem 0.625rem calc(3.75rem + 2px);
      }
      #search::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      li {
        display: flex;
        align-items: center;
        min-height: 2.65rem; /* every row type matches a link row */
        border-bottom: 1px solid var(--line);
        border-left: 2px solid transparent;
      }
      /* Only the keyboard selection looks selected. Hover and stray focus
         reveal the row's buttons but never tint the row. */
      li.selected {
        background: color-mix(in srgb, var(--fg) 9%, transparent);
      }
      li.selected {
        border-left-color: var(--accent);
      }
      .num {
        width: 1.75rem;
        padding-left: 0.75rem;
        text-align: right;
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      li.selected .num {
        color: var(--accent);
      }
      /* Fold state sits just past the title, not out at the margin. */
      .twist {
        padding: 0 0.5rem;
        font-size: 0.8125rem;
        color: color-mix(in srgb, var(--fg) 65%, transparent);
      }
      li.selected .twist {
        color: var(--accent);
      }
      /* Children sit under their parent, marked rather than bulleted. */
      .tree {
        padding-left: 0.5rem;
        font-size: 0.6875rem;
        color: var(--muted);
        opacity: 0.55;
      }
      li.depth-1 .tree {
        margin-left: 1.25rem;
      }
      .label {
        flex: 0 1 auto;
        min-width: 0;
        padding: 0.625rem 0.75rem;
        color: inherit;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li.selected .label {
        color: var(--accent);
        text-shadow: 0 0 12px var(--glow);
      }
      .actions {
        display: flex;
        margin-left: auto;
        gap: 0.25rem;
        padding-right: 0.5rem;
        visibility: hidden;
      }
      li:hover .actions,
      li.selected .actions {
        visibility: visible;
      }
      button {
        font: inherit;
        font-size: 0.6875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        color: var(--accent);
      }
      li.editing,
      li.confirm,
      li.add {
        background: none;
      }
      form {
        display: flex;
        gap: 0.375rem;
        width: 100%;
        padding: 0.375rem 0.5rem 0.375rem 2.5rem;
      }
      li.depth-1 form,
      li.confirm.depth-1 .prompt {
        padding-left: 3.75rem;
      }
      input {
        font: inherit;
        color: var(--fg);
        caret-color: var(--accent);
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 0.25rem;
        min-width: 0;
      }
      input::placeholder {
        color: var(--muted);
      }
      input:disabled {
        color: var(--muted);
        border-bottom-style: dashed;
      }
      input:focus {
        border-bottom-color: var(--accent);
      }
      input:first-of-type {
        flex: 1;
      }
      input:nth-of-type(2) {
        flex: 2;
      }
      .confirm .prompt {
        flex: 1;
        min-width: 0;
        padding: 0.625rem 0.75rem 0.625rem 2.5rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .confirm .icon:first-of-type {
        color: var(--accent);
      }
      /* Opening a link: the row lights, everything else recedes. */
      ul.launching li:not(.launching) {
        opacity: 0.18;
        transition: opacity 140ms ease-out;
      }
      li.launching {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        border-left-color: var(--accent);
      }
      li.launching .label {
        color: var(--accent);
        text-shadow: 0 0 16px var(--glow);
      }
      li.launching .num {
        animation: pulse 160ms steps(2, end) 2;
      }
      @keyframes pulse {
        50% {
          opacity: 0.2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        ul.launching li:not(.launching) {
          transition: none;
        }
        li.launching .num {
          animation: none;
        }
      }
      .add-button {
        align-self: stretch;
        text-align: left;
        padding: 0 0.75rem 0 2.5rem;
      }
    </style>
  </head>
  <body>
    <canvas id="haze" aria-hidden="true"></canvas>
    <canvas id="sky" aria-hidden="true"></canvas>
    <main>
      <input
        id="search"
        type="text"
        placeholder="search"
        autocomplete="off"
        spellcheck="false"
      />
      <ul id="links"></ul>
    </main>
    <script src="background-art.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
