<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --bg: #fafafa;
        --muted: #8a8a8a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f0f0f0;
          --bg: #1a1a1a;
          --muted: #7a7a7a;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font: 1rem/1.5 system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        width: min(32rem, 90vw);
      }
      li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border-radius: 0.375rem;
      }
      li:hover,
      li:focus-within,
      li.selected {
        background: color-mix(in srgb, var(--fg) 8%, transparent);
      }
      a {
        flex: 1;
        min-width: 0;
        padding: 0.5rem 0.75rem;
        color: inherit;
        text-decoration: none;
        font-size: 1.125rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: flex;
        gap: 0.25rem;
        padding-right: 0.5rem;
        visibility: hidden;
      }
      li:hover .actions,
      li:focus-within .actions,
      li.selected .actions {
        visibility: visible;
      }
      button {
        font: inherit;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 0.25rem;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        color: var(--fg);
      }
      .icon {
        font-size: 0.8125rem;
      }
      li.editing,
      li.add {
        background: none;
      }
      form {
        display: flex;
        gap: 0.25rem;
        width: 100%;
        padding: 0.25rem 0.5rem;
      }
      input {
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
        border-radius: 0.25rem;
        padding: 0.25rem 0.5rem;
        min-width: 0;
      }
      input:first-of-type {
        flex: 1;
      }
      input:nth-of-type(2) {
        flex: 2;
      }
      .add-button {
        font-size: 0.875rem;
        padding: 0.5rem 0.75rem;
      }
    </style>
  </head>
  <body>
    <ul id="links"></ul>
    <script src="newtab.js"></script>
  </body>
</html>
